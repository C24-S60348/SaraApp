<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaraApp</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a class="brand" href="index.html">SaraApp</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="games/tanam/index.html">Tanam Tanam</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h1>Our To-Do List</h1>
      <p>Click a card to see more. You can change a status inside the card (it is saved in this browser only).</p>
    </section>

    <div class="filters" id="filters" role="tablist" aria-label="Filter by status"></div>
    <div class="todo-grid" id="todo-list"></div>
    <p class="empty" id="empty" hidden>Nothing here yet.</p>
  </main>

  <dialog id="todo-dialog">
    <form method="dialog"><button class="close" aria-label="Close">×</button></form>
    <h2 id="d-title"></h2>
    <label class="status-row">Status
      <select id="d-status">
        <option value="todo">To do</option>
        <option value="doing">In progress</option>
        <option value="done">Done</option>
      </select>
    </label>
    <p id="d-desc"></p>
    <ul id="d-notes"></ul>
    <a id="d-link" class="btn" hidden>Open</a>
  </dialog>

  <footer>Built with HTML, CSS and JavaScript</footer>
  <script src="data/todos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
