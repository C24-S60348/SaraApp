<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tanam Tanam · SaraApp</title>
  <link rel="stylesheet" href="tanam.css">
</head>
<body>
  <div class="topbar">
    <a class="pill" href="../../index.html">Home</a>
    <span class="topright">
      <button class="pill" id="btn-back" hidden>← Kembali</button>
      <button class="pill gear" id="btn-settings" type="button" aria-label="Tetapan" title="Tetapan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.500a3.500 3.500 0 1 0 0-7 3.500 3.500 0 0 0 0 7z"/><path d="M19.400 15a1.700 1.700 0 0 0 .3 1.800l.1.1a2 2 0 1 1-2.800 2.800l-.1-.1a1.700 1.700 0 0 0-1.800-.3 1.700 1.700 0 0 0-1 1.500V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-1.100-1.500 1.700 1.700 0 0 0-1.800.3l-.1.1a2 2 0 1 1-2.800-2.800l.1-.1a1.700 1.700 0 0 0 .3-1.800 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.800l-.1-.1a2 2 0 1 1 2.800-2.800l.1.1a1.700 1.700 0 0 0 1.800.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.1a1.700 1.700 0 0 0-.3 1.800V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z"/></svg>
      </button>
    </span>
  </div>

  <!-- settings panel -->
  <div class="settings" id="settings" hidden>
    <div class="settings-card" role="dialog" aria-labelledby="settings-title">
      <h2 id="settings-title">Tetapan</h2>
      <a class="set-item" href="kuiz-admin.html"><b>Senarai soalan kuiz</b><small>Untuk admin sahaja. Perlu kata laluan.</small></a>
      <a class="set-item" href="kuiz.html"><b>Kuiz 2 Pemain</b><small>Main kuiz dengan rakan.</small></a>
      <button class="set-item" id="reset-progress" type="button"><b>Padam kemajuan belajar</b><small>Mula semula semua tahap dan bintang di peranti ini.</small></button>
      <button class="set-close" id="settings-close" type="button">Tutup</button>
    </div>
  </div>

  <!-- 1. Main menu -->
  <section class="screen" id="screen-menu">
    <div class="menu-art" id="menu-art"></div>
    <h1 class="logo">Tanam Tanam</h1>
    <p class="tagline">Belajar menanam, langkah demi langkah.</p>
    <a class="play" href="belajar.html">Main</a>
    <div class="menu-more">
      <button class="play small" id="btn-play" type="button">Lihat Tanaman</button>
      <a class="play quizbtn" href="kuiz.html">Kuiz 2 Pemain</a>
    </div>
  </section>

  <!-- 2. Pilih Tanaman -->
  <section class="screen" id="screen-pilih" hidden>
    <h2 class="title">Pilih Tanaman</h2>
    <div class="grid" id="plant-grid"></div>
  </section>

  <!-- 3. How to tanam -->
  <section class="screen" id="screen-detail" hidden>
    <div class="detail">
      <div class="stage-col">
        <div class="stage-view" id="stage-view"></div>
        <p class="stage-name" id="stage-name"></p>
        <p class="stage-text" id="stage-text"></p>
        <button class="water" id="btn-water">Siram air</button>
      </div>
      <div class="info-col">
        <h2 class="title left" id="d-name"></h2>
        <p class="d-desc" id="d-desc"></p>
        <div class="facts" id="d-facts"></div>
        <h3>Peringkat</h3>
        <div class="stages" id="d-stages"></div>
        <h3>Cara menanam</h3>
        <ol id="d-steps"></ol>
      </div>
    </div>
  </section>

  <script src="plants.js"></script>
  <script src="tanam.js"></script>
</body>
</html>
