<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zuma Duo · SaraApp</title>
  <link rel="stylesheet" href="zuma.css">
</head>
<body>
  <div class="toast" id="toast" hidden></div>
  <div class="topbar">
    <a class="pill" href="../../index.html">Home</a>
    <span class="rotate-note">Best in landscape</span>
    <span class="right">
      <button class="pill" id="btn-sound" type="button"></button>
      <button class="pill" id="btn-menu" type="button">Menu</button>
    </span>
  </div>

  <div class="stage">
    <canvas id="c" width="1280" height="640"></canvas>

    <!-- 1. main menu -->
    <div class="overlay" id="ov-menu">
      <div class="modal">
        <h1 class="logo">Zuma Duo</h1>
        <p>Two players, one chain. Work together and stop it before it reaches the skull!</p>
        <div class="btns"><button class="go" id="btn-play" type="button">Play</button><button class="go alt" id="btn-online" type="button">Play online</button></div>
      </div>
    </div>

    <!-- online lobby / messages -->
    <div class="overlay" id="ov-net" hidden>
      <div class="modal">
        <h2 id="net-title"></h2>
        <p id="net-text"></p>
        <div class="extra" id="net-nodes"></div>
        <div class="btns" id="net-btns"></div>
      </div>
    </div>

    <!-- 2. choose a level -->
    <div class="overlay" id="ov-level" hidden>
      <div class="modal wide">
        <h2>Choose a level</h2>
        <div class="levels" id="levels"></div>
      </div>
    </div>

    <!-- 3. controls -->
    <div class="overlay" id="ov-mode" hidden>
      <div class="modal wide">
        <h2>Choose your controls</h2>
        <div class="modes">
          <button class="mode" id="mode-keys" type="button">
            <b>Keyboard + Mouse</b><em>Best for computer</em>
            <span>P1 (left): <kbd>←</kbd> <kbd>→</kbd> turn, <kbd>↑</kbd> shoot, <kbd>↓</kbd> switch colour</span>
            <span>P2 (right): mouse to aim, click to shoot, right click to switch</span>
          </button>
          <button class="mode" id="mode-touch" type="button">
            <b>Touch + Touch</b><em>Best for touch screens</em>
            <span>P1 uses the <u>left half</u> of the screen, P2 the <u>right half</u>.</span>
            <span><b>Hold</b> to aim, <b>release</b> to shoot. Tap your frog to switch colour.</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 4. game over -->
    <div class="overlay" id="ov-over" hidden>
      <div class="modal">
        <h2 id="over-title"></h2>
        <p id="over-text"></p>
        <div class="btns"><button class="go" id="btn-again" type="button">Play again</button><button class="go alt" id="btn-next" type="button" hidden>Next level</button><button class="go alt" id="btn-levels" type="button">Levels</button></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../../js/sfx.js"></script>
  <script src="zuma.js"></script>
  <script src="zuma-online.js"></script>
</body>
</html>
